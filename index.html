<script>
function n(id){return parseFloat(document.getElementById(id).value)}
function show(id,msg){document.getElementById(id).textContent=msg}

function calc(a,b,r,m){
  let x=n(a),y=n(b);
  if(!isFinite(x)||!isFinite(y)||y===0)
    return show(r,"Please enter valid values.");
  show(r,(x/y*m).toFixed(4))
}

function multiply(a,b,r){
  let x=n(a),y=n(b);
  if(!isFinite(x)||!isFinite(y))
    return show(r,"Please enter valid values.");
  show(r,(x*y).toFixed(4))
}

function dilution(){
  let a=n('dC1'),b=n('dV1'),c=n('dC2');
  if(!isFinite(a)||!isFinite(b)||!isFinite(c)||c===0)
    return show('dR','Please enter valid values.');
  show('dR','V₂ = '+(a*b/c).toFixed(4))
}

function ph(){
  let x=n('phA');
  if(x<=0||!isFinite(x))
    return show('phR','Enter a positive concentration.');
  show('phR','pH = '+(-Math.log10(x)).toFixed(4))
}

function tempCalc(){
  let x=n('temp');
  if(!isFinite(x))
    return show('tempR','Enter a valid temperature.');
  show('tempR',x+' °C = '+(x+273.15).toFixed(2)+' K')
}

function gpa(){
  let c=document.getElementById('credits').value.split(',').map(Number),
      g=document.getElementById('grades').value.split(',').map(Number);

  if(c.length!==g.length ||
     c.some(x=>!isFinite(x)) ||
     g.some(x=>!isFinite(x)) ||
     c.reduce((a,b)=>a+b,0)<=0)
    return show('gpaR','Enter matching values.');

  let tc=c.reduce((a,b)=>a+b,0),
      q=c.reduce((s,x,i)=>s+x*g[i],0);

  show('gpaR','GPA = '+(q/tc).toFixed(2))
}

function change(){
  let a=n('chA'),b=n('chB');
  if(!isFinite(a)||!isFinite(b)||a===0)
    return show('chR','Enter valid values.');

  let p=(b-a)/a*100;
  show('chR',(p>=0?'Increase: ':'Decrease: ')+Math.abs(p).toFixed(2)+'%')
}

function cgpa(){
  let a=n('cgA'),b=n('cgB');
  if(!isFinite(a)||!isFinite(b)||b<=0)
    return show('cgR','Enter valid values.');

  show('cgR','Approx. percentage: '+(a/b*100).toFixed(2)+'%')
}

function planner(){
  let s=document.getElementById('subject').value.trim(),
      d=n('days'),
      h=n('hours');

  if(!s||!isFinite(d)||!isFinite(h)||d<1||h<=0)
    return show('planR','Please enter subject, days and daily hours.');

  let out='<strong>'+s+' — '+d+' day plan</strong><br><br>';

  for(let i=1;i<=d;i++){
    let task=i<=Math.ceil(d*.25)
      ?'Learn concepts & make notes'
      :i<=Math.ceil(d*.65)
      ?'Practice questions & examples'
      :i<=Math.ceil(d*.85)
      ?'Past papers / problem solving'
      :'Revision & self-test';

    out+='Day '+i+': '+task+' ('+h+' hour'+(h==1?'':'s')+')<br>';
  }

  show('planR','');
  document.getElementById('planR').innerHTML=out;
}
</script>
